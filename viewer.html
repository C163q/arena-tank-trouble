<!-- Generated by arena-runner viewer. Edit the player sources. -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>坦克竞技场 · 对局回放</title>
<style>
:root { color-scheme: light; font-family: system-ui, sans-serif; background: #e6e9e3; color: #263433; }
body { margin: 0; }
main { max-width: 64rem; margin: auto; padding: 1.25rem; }
h1 { margin: 0 0 .8rem; font-size: 1.5rem; }
.drop-zone {
  display: grid; justify-items: center; align-content: center; gap: .55rem;
  box-sizing: border-box; min-height: 12rem; padding: 1rem; margin-bottom: .8rem;
  border: 2px dashed #7e9087; border-radius: .6rem; background: #f3f5ef; text-align: center;
}
.drop-zone.has-replay { min-height: 7rem; }
.drop-zone p { margin: 0; }
.drop-title { font-size: 1.15rem; font-weight: 650; }
.drop-formats { color: #4c6259; }
#open-replay { position: absolute; width: 1px; height: 1px; opacity: 0; }
.choose-file {
  border: 1px solid #7e9087; border-radius: .35rem; padding: .3rem .7rem;
  background: #e6e9e3; cursor: pointer;
}
#open-replay:focus-visible + .choose-file { outline: 2px solid #24694f; outline-offset: 3px; }
#drop-overlay {
  position: fixed; z-index: 1; inset: 1rem; display: grid; place-items: center;
  border: 3px dashed #24694f; border-radius: .75rem; background: #e6f0e8ee;
  color: #245342; font-size: 1.35rem; font-weight: 650; text-align: center; pointer-events: none;
}
#drop-overlay[hidden] { display: none; }
#file-status { margin: 0 0 .8rem; overflow-wrap: anywhere; }
#file-status:empty { display: none; }
#file-status.error { color: #8b3427; }
canvas { display: block; width: 100%; aspect-ratio: 3 / 2; border-radius: .5rem; background: #f1f2ee; }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: .8rem; margin-top: .8rem; }
input[type="range"] { min-width: 7rem; flex: 1; }
button, select { font: inherit; padding: .2rem .45rem; color: inherit; }
output { font-variant-numeric: tabular-nums; }
table { width: 100%; text-align: left; border-collapse: collapse; }
caption { font-weight: bold; text-align: left; margin-bottom: .4rem; }
td, th { padding: .32rem .2rem; border-bottom: 1px solid #bec7be; overflow-wrap: anywhere; }
.color { display: inline-block; height: .75rem; width: .75rem; margin-right: .35rem; vertical-align: baseline; border-radius: 50%; }
</style>
</head>
<body>
<main>
<h1>坦克对局回放</h1>
<div class="drop-zone">
  <p class="drop-title">拖入回放文件</p>
  <p class="drop-formats"><code>replay.json</code> 或 <code>timeline.jsonl</code></p>
  <input id="open-replay" type="file" accept=".json,.jsonl,application/json,application/x-ndjson">
  <label class="choose-file" for="open-replay">选择文件</label>
</div>
<p id="file-status" role="status">正在启动播放器。如果此提示一直存在，请在浏览器中直接打开此 HTML 文件。</p>
<section id="match" aria-label="回放" hidden>
<canvas aria-label="对局画面"></canvas>
<div class="controls">
  <button id="play" type="button">播放</button>
  <input id="seek" type="range" min="0" value="0" aria-label="回放进度">
  <output id="time" for="seek"></output>
  <label>倍速 <select id="speed"><option value=".5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
</div>
<p id="result"></p>
<table>
  <caption>最终积分</caption>
  <thead><tr><th scope="col">席位</th><th scope="col">击杀分</th><th scope="col">存活分</th><th scope="col">总分</th></tr></thead>
  <tbody id="scoreboard"></tbody>
</table>
</section>
</main>
<div id="drop-overlay" hidden aria-hidden="true">松开以导入回放</div>
<script type="module">
const palette = {
  ground: "#f1f2ee",
  wall: "#3c454a",
  laser: "#087e87",
  shotgun: "#b76b18",
  danger: "#a43b3b57",
  zoneBoundary: "#ab4444",
};

const tankColors = [
  { main: "#b65430", light: "#e8a37d", dark: "#68341f" },
  { main: "#51768b", light: "#acc2cd", dark: "#314c5b" },
  { main: "#6e7841", light: "#c5cd88", dark: "#3b4729" },
  { main: "#896192", light: "#d4a8db", dark: "#513757" },
];

let latestCanvas;
let latestRound;
let latestTick;

function tank(ctx, { pose, next_shot }, colors, geometry) {
  const { tank_length: length, tank_width: width, muzzle_distance: muzzle } = geometry;
  const trackWidth = width * 0.25;
  ctx.save();
  ctx.translate(pose.position.x, pose.position.y);
  ctx.rotate(pose.angle);

  ctx.fillStyle = colors.dark;
  ctx.fillRect(-length / 2, -width / 2, length, width);
  if (next_shot === "laser") {
    const gap = width * 0.15;
    const rail = width * 0.085;
    ctx.fillStyle = palette.laser;
    ctx.fillRect(0, gap, muzzle, rail);
    ctx.fillRect(0, -gap - rail, muzzle, rail);
  } else if (next_shot === "shotgun") {
    const base = length * 0.30;
    ctx.fillStyle = palette.shotgun;
    ctx.fillRect(base, -width * 0.24, muzzle - base, width * 0.48);
    ctx.fillStyle = colors.dark;
    ctx.fillRect(muzzle - 0.024, -width * 0.17, 0.024, width * 0.34);
  } else {
    ctx.beginPath();
    ctx.roundRect(0, -width * 0.12, muzzle, width * 0.24, width * 0.05);
    ctx.fill();
  }

  ctx.fillStyle = colors.main;
  ctx.fillRect(-length / 2, -width / 2 + trackWidth, length, width - 2 * trackWidth);
  ctx.fillStyle = colors.light;
  ctx.beginPath();
  ctx.roundRect(-length * 0.20, -width * 0.2, length * 0.45, width * 0.4, width * 0.13);
  ctx.fill();
  ctx.restore();
}

function drawSafeZone(ctx, { safe_zone, width, height }) {
  if (!safe_zone) return;
  const { min, max } = safe_zone;
  if (min.x === 0 && min.y === 0 && max.x === width && max.y === height) return;

  const safeWidth = max.x - min.x;
  const safeHeight = max.y - min.y;
  ctx.fillStyle = palette.danger;
  ctx.beginPath();
  ctx.rect(0, 0, width, height);
  ctx.rect(min.x, min.y, safeWidth, safeHeight);
  ctx.fill("evenodd");
  if (safeWidth > 0 && safeHeight > 0) {
    ctx.strokeStyle = palette.zoneBoundary;
    ctx.lineWidth = 0.04;
    ctx.strokeRect(min.x, min.y, safeWidth, safeHeight);
  }
}

export function render(canvas, state) {
  const ratio = window.devicePixelRatio || 1;
  const width = Math.round(canvas.clientWidth * ratio);
  const height = Math.round(canvas.clientHeight * ratio);
  if (width === 0 || height === 0) return;

  const resized = canvas.width !== width || canvas.height !== height;
  if (!resized && latestCanvas === canvas && latestRound === state.round && latestTick === state.tick) {
    return;
  }
  if (resized) {
    canvas.width = width;
    canvas.height = height;
  }
  latestCanvas = canvas;
  latestRound = state.round;
  latestTick = state.tick;

  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const padding = 0.24;
  const scale = Math.min(width / (state.width + padding), height / (state.height + padding));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = palette.ground;
  ctx.fillRect(0, 0, width, height);
  ctx.setTransform(scale, 0, 0, scale,
    (width - state.width * scale) / 2, (height - state.height * scale) / 2);

  drawSafeZone(ctx, state);

  const thickness = state.geometry.wall_thickness;
  const half = thickness / 2;
  ctx.fillStyle = palette.wall;
  ctx.beginPath();
  for (const { a, b } of state.walls) {
    ctx.rect(Math.min(a.x, b.x) - half, Math.min(a.y, b.y) - half,
      Math.abs(a.x - b.x) + thickness, Math.abs(a.y - b.y) + thickness);
  }
  ctx.fill();

  const pickupSize = state.geometry.pickup_size;
  for (const { x, y, kind } of state.pickups) {
    ctx.fillStyle = palette[kind];
    ctx.fillRect(x - pickupSize / 2, y - pickupSize / 2, pickupSize, pickupSize);
    ctx.fillStyle = palette.ground;
    if (kind === "shotgun") {
      for (const offset of [-1, 0, 1]) {
        ctx.beginPath();
        ctx.arc(x + offset * pickupSize * 0.22, y, pickupSize * 0.065, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.fillRect(x - pickupSize / 4, y - pickupSize / 16, pickupSize / 2, pickupSize / 8);
    }
  }

  ctx.strokeStyle = palette.laser;
  ctx.lineWidth = state.geometry.laser_radius * 2;
  ctx.lineCap = "round";
  ctx.beginPath();
  for (const { start, end } of state.laser_trails) {
    ctx.moveTo(start.x, start.y);
    ctx.lineTo(end.x, end.y);
  }
  ctx.stroke();

  state.tanks.forEach((seat, index) => {
    if (seat.alive) tank(ctx, seat, tankColors[index], state.geometry);
  });

  for (const { kind, position: { x, y } } of state.projectiles) {
    const laser = kind === "laser";
    const radius = laser ? state.geometry.laser_radius : state.geometry.projectile_radius;
    ctx.fillStyle = laser ? palette.laser : palette.wall;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

const canvas = document.querySelector("canvas");
const match = document.querySelector("#match");
const play = document.querySelector("#play");
const seek = document.querySelector("#seek");
const time = document.querySelector("#time");
const speed = document.querySelector("#speed");
const scoreboard = document.querySelector("#scoreboard");
const fileStatus = document.querySelector("#file-status");
const input = document.querySelector("#open-replay");
const dropZone = document.querySelector(".drop-zone");
const dropOverlay = document.querySelector("#drop-overlay");
let replay;
let position = 0;
let previous = null;
let animation = 0;
let loadId = 0;
let dragDepth = 0;

function decodeFrame(record) {
  const { tick, tanks, projectiles, pickups, laser_trails, safe_zone } = record;
  const [minX, minY, maxX, maxY] = safe_zone ?? [];
  return {
    tick,
    tanks: tanks.map(([x, y, angle, alive, ammo, refill_at, next_shot]) =>
      ({ pose: { position: { x, y }, angle }, alive, ammo, refill_at, next_shot })),
    projectiles: projectiles.map(([owner, kind, x, y, vx, vy, wall_contacts]) =>
      ({ owner, kind, position: { x, y }, velocity: { x: vx, y: vy }, wall_contacts })),
    pickups: pickups.map(([kind, x, y]) => ({ kind, x, y })),
    laser_trails: laser_trails.map(([owner, x1, y1, x2, y2, expires_at]) =>
      ({ owner, start: { x: x1, y: y1 }, end: { x: x2, y: y2 }, expires_at })),
    safe_zone: safe_zone == null ? null : { min: { x: minX, y: minY }, max: { x: maxX, y: maxY } },
  };
}

function parseReplay(text) {
  try {
    return JSON.parse(text);
  } catch (error) {
    if (!(error instanceof SyntaxError)) throw error;
  }
  const lines = text.split(/\r?\n/);
  const header = JSON.parse(lines.shift());
  if (header?.type !== "arena_timeline" || header.format_version !== 1) {
    throw new Error("未知的回放格式或版本");
  }
  const footer = JSON.parse(lines.pop());
  if (footer?.type !== "result" || footer.tick !== lines.length - 1) {
    throw new Error("逐步记录缺少完整结算");
  }
  return {
    ...header,
    frames: lines.map((line) => decodeFrame(JSON.parse(line))),
    scores: footer.scores,
    result: footer.result,
  };
}

const positive = (value) => Number.isFinite(value) && value > 0;
const nonnegative = (value) => Number.isSafeInteger(value) && value >= 0;
const point = (p) => p && Number.isFinite(p.x) && Number.isFinite(p.y);

function validZone(zone, { width, height }) {
  return zone == null || (point(zone.min) && point(zone.max)
    && zone.min.x >= 0 && zone.min.y >= 0 && zone.max.x <= width && zone.max.y <= height
    && zone.min.x <= zone.max.x && zone.min.y <= zone.max.y);
}

function validFrame(frame, tick, seats, map) {
  return frame?.tick === tick && Array.isArray(frame.tanks) && frame.tanks.length === seats
    && frame.tanks.every((tank) => point(tank?.pose?.position) && Number.isFinite(tank.pose.angle)
      && typeof tank.alive === "boolean"
      && [null, "laser", "shotgun"].includes(tank.next_shot))
    && Array.isArray(frame.projectiles)
    && frame.projectiles.every((shot) => point(shot?.position) && ["shell", "laser"].includes(shot.kind))
    && Array.isArray(frame.pickups)
    && frame.pickups.every((pickup) => point(pickup) && ["laser", "shotgun"].includes(pickup.kind))
    && Array.isArray(frame.laser_trails)
    && frame.laser_trails.every((trail) => point(trail?.start) && point(trail.end))
    && validZone(frame.safe_zone, map);
}

function validate(data) {
  if (data?.format_version !== 1) {
    throw new Error("未知的回放格式或版本");
  }
  const { map, geometry, seats, scores, frames, result } = data;
  if (!Array.isArray(seats) || seats.length < 2 || seats.length > tankColors.length
      || !seats.every((name) => typeof name === "string")
      || !positive(data.ticks_per_second) || typeof data.seed !== "string"
      || !positive(map?.width) || !positive(map?.height) || !Array.isArray(map.walls)
      || !map.walls.every((wall) => point(wall?.a) && point(wall.b))
      || !["tank_length", "tank_width", "muzzle_distance", "projectile_radius",
        "wall_thickness", "pickup_size", "laser_radius"].every((name) => positive(geometry?.[name]))
      || !Array.isArray(scores) || scores.length !== seats.length
      || !scores.every((score) => nonnegative(score?.kill_points) && nonnegative(score.survival_points))
      || !["winner", "time_limit", "all_eliminated"].includes(result?.reason)
      || (result.reason === "winner" && !(nonnegative(result.seat) && result.seat < seats.length))
      || !Array.isArray(frames) || frames.length === 0
      || !frames.every((frame, tick) => validFrame(frame, tick, seats.length, map))) {
    throw new Error("回放数据不完整或已损坏");
  }
}

function load(data) {
  validate(data);
  pause();
  replay = data;
  position = 0;
  seek.max = replay.frames.length - 1;
  const seatName = (seat) => (seat + 1) + " 号 · " + replay.seats[seat];
  const end = replay.result;
  document.querySelector("#result").textContent =
    (end.reason === "winner" ? seatName(end.seat) + " 获胜"
      : end.reason === "time_limit" ? "到达时限 · 平局" : "全灭 · 平局")
    + "　种子 " + replay.seed;

  scoreboard.replaceChildren();
  replay.scores.forEach(({ kill_points, survival_points }, seat) => {
    const row = scoreboard.insertRow();
    const cell = row.insertCell();
    const color = document.createElement("span");
    color.className = "color";
    color.style.backgroundColor = tankColors[seat].main;
    cell.append(color, seatName(seat));
    for (const points of [kill_points, survival_points, kill_points + survival_points]) {
      row.insertCell().textContent = points;
    }
  });
  match.hidden = false;
  dropZone.classList.add("has-replay");
  show();
}

function show() {
  if (!replay) return;
  const tick = Math.floor(position);
  const last = replay.frames.length - 1;
  seek.value = tick;
  time.textContent = (tick / replay.ticks_per_second).toFixed(1) + " / "
    + (last / replay.ticks_per_second).toFixed(1) + " 秒";
  // A different match can have the same tick and canvas size.
  const { tanks, projectiles, pickups, laser_trails, safe_zone } = replay.frames[tick];
  const { width, height, walls } = replay.map;
  render(canvas, {
    round: replay, tick, width, height, walls, geometry: replay.geometry,
    tanks, projectiles, pickups, laser_trails, safe_zone,
  });
}

function pause() {
  cancelAnimationFrame(animation);
  animation = 0;
  previous = null;
  play.textContent = "播放";
}

function advance(now) {
  const last = replay.frames.length - 1;
  if (previous !== null) {
    const steps = ((now - previous) / 1000) * replay.ticks_per_second * Number(speed.value);
    position = Math.min(last, position + steps);
    show();
  }
  previous = now;
  if (position >= last) pause();
  else animation = requestAnimationFrame(advance);
}

play.addEventListener("click", () => {
  if (animation) {
    pause();
    return;
  }
  if (position === replay.frames.length - 1) {
    position = 0;
    show();
  }
  play.textContent = "暂停";
  animation = requestAnimationFrame(advance);
});
seek.addEventListener("input", () => {
  position = Number(seek.value);
  previous = null;
  show();
});
speed.addEventListener("change", () => { previous = null; });
new ResizeObserver(show).observe(canvas);

function setFileStatus(message, error = false) {
  fileStatus.textContent = message;
  fileStatus.classList.toggle("error", error);
}

async function openFile(file) {
  if (!file) return;
  const id = ++loadId;
  setFileStatus("正在读取 " + file.name);
  try {
    const text = (await file.text()).trim();
    if (id !== loadId) return;
    load(parseReplay(text));
    setFileStatus("已载入 " + file.name);
  } catch {
    if (id !== loadId) return;
    setFileStatus("无法载入 " + file.name + "，请检查回放格式和文件完整性。", true);
  }
}

input.addEventListener("change", () => {
  const file = input.files[0];
  input.value = "";
  openFile(file);
});
function hasFiles(transfer) {
  return transfer?.files?.length > 0
    || Array.from(transfer?.types ?? []).includes("Files")
    || Array.from(transfer?.items ?? []).some((item) => item.kind === "file");
}

function hasText(transfer) {
  return Array.from(transfer?.types ?? []).some((type) =>
    ["text/uri-list", "text/plain", "text/html", "text/x-moz-url"].includes(type));
}

function clearDrag() {
  dragDepth = 0;
  dropOverlay.hidden = true;
}

window.addEventListener("dragenter", (event) => {
  if (!hasFiles(event.dataTransfer)) return;
  event.preventDefault();
  dragDepth += 1;
  dropOverlay.hidden = false;
});
window.addEventListener("dragover", (event) => {
  if (hasFiles(event.dataTransfer)) {
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
    dropOverlay.hidden = false;
  } else if (hasText(event.dataTransfer)) {
    event.preventDefault();
  }
});
window.addEventListener("dragleave", () => {
  if (dragDepth > 0) dragDepth -= 1;
  if (dragDepth === 0) clearDrag();
});
window.addEventListener("dragend", clearDrag);
window.addEventListener("drop", (event) => {
  clearDrag();
  const transfer = event.dataTransfer;
  if (!hasFiles(transfer) && !hasText(transfer)) return;
  event.preventDefault();
  const file = transfer.files?.[0]
    ?? Array.from(transfer.items ?? []).find((item) => item.kind === "file")?.getAsFile();
  if (file) {
    openFile(file);
  } else {
    ++loadId;
    setFileStatus("请从文件管理器拖入回放文件，或点击「选择文件」。", true);
  }
});

const embedded = document.querySelector("#replay-data");
if (embedded) {
  load(parseReplay(embedded.textContent));
}

setFileStatus("");

</script>
</body>
</html>
